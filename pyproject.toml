[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "financial-advisor"
version = "0.1.0"
description = "Personal financial spending dashboard using Plaid, SQLite, and Streamlit"
requires-python = ">=3.11"
dependencies = [
    "plaid-python>=17.0.0",
    "streamlit>=1.32.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.19.0",
    "flask>=3.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests (require Plaid sandbox credentials)",
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/dashboard/*",   # Streamlit rendering is not unit-testable
    "src/link/server.py",  # Flask route handlers require a running server to test
]

[tool.coverage.report]
fail_under = 80
